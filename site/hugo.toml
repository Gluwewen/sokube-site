# Global Hero Configuration
[params.hero]
  background = "bg-gradient-to-b from-neurokube-100 to-neurokube-50 dark:from-neurokube-900 dark:to-neurokube-900"

  [params.hero.style]
    title = "text-neurokube-900 dark:text-white"
    description = "text-gray-600 dark:text-neurokube-200"

    decoration_1 = "bg-neurokube-100 dark:bg-neurokube-800"
    decoration_2 = "bg-neurokube-200 dark:bg-neurokube-700"

  [params.hero.primary_button]
    background = "bg-neurokube-600"
    text_color = "text-white"
    hover = "hover:bg-neurokube-700"

  [params.hero.secondary_button]
    background = "bg-white dark:bg-neurokube-800"
    text_color = "text-neurokube-600 dark:text-neurokube-100"
    hover = "hover:bg-neurokube-100 dark:hover:bg-neurokube-700"
    border = "border-neurokube-600 dark:border-neurokube-400"

# Hero Fondu shortcode (see layouts/shortcodes/sokube-hero-fondu.html).
# Instancié différemment selon la page (règle 12) : fonctionne par palette
# nommée pour la couleur du panneau + de la description, comme
# [params.cards]/[params.feature] (règle 5). Titre, boutons et la
# progressivité du fondu (fadeDistance) ne varient pas selon la palette :
# défaut unique dans [params.heroFondu.style], sur le même principe que
# [params.feature.style].
[params.heroFondu]
  [params.heroFondu.style]
    title = "text-white"

    # Distance (en % de la largeur du panneau image) à laquelle le dégradé
    # de fondu devient entièrement transparent - au-delà, la photo est
    # visible sans aucune teinte. Plus la valeur est petite, plus on voit
    # tôt la photo nette (fondu court et progressif dès le bord) ; plus elle
    # est grande, plus la couleur du panneau s'étend sur la photo. Surchargeable
    # par instance via le paramètre fade_distance du shortcode / hero.fade_distance
    # du front matter.
    fadeDistance = "80%"

    [params.heroFondu.style.primary_button]
      background = "bg-kube-600"
      text_color = "text-white"
      hover = "hover:bg-kube-700"

    [params.heroFondu.style.secondary_button]
      background = "bg-transparent"
      text_color = "text-white"
      border = "border-white"
      hover_background = "hover:bg-white"
      hover_text_color = "hover:text-neurokube-900"

  # "colorVar" référence une variable CSS définie dans assets/css/custom.css
  # (elle-même lue depuis tailwind.config.js via theme(), source unique) -
  # utilisée par layouts/partials/hero-fondu.html pour le dégradé CSS
  # linear-gradient() du fondu, un cas où une classe Tailwind ne peut pas
  # suffire (même technique que [params.feature.<nom>].colorVar, règle 5).
  # Ne jamais mettre une valeur hexadécimale en dur ici : ajouter une
  # nouvelle variable --color-<palette>-<teinte> dans custom.css à la place.
  [params.heroFondu.default]
    background = "bg-neurokube-900"
    description = "text-neurokube-100"
    colorVar = "--color-neurokube-900"

  [params.heroFondu.kube]
    background = "bg-kube-900"
    description = "text-kube-100"
    colorVar = "--color-kube-900"

  [params.heroFondu.hr]
    background = "bg-hr-900"
    description = "text-hr-100"
    colorVar = "--color-hr-900"

# Global CTA Configuration
[params.cta]
  enable = true

  [params.cta.style]
    background = "bg-neurokube-600"
    title = "text-white"
    description = "text-neurokube-100"
    # Default "Contact us" card background, when a page uses showContactBlock="true"
    # without specifying its own background in the .Inner YAML.
    contactBackground = "bg-white dark:bg-neurokube-900"

  [params.cta.primary_button]
    class = "bg-white text-neurokube-600 hover:bg-neurokube-200"
    background = "bg-white"
    text_color = "text-neurokube-600"
    hover = "hover:bg-neurokube-200"

#  [params.cta.secondary_button]
#    class = "border-white text-white hover:bg-neurokube-800"
#    text_color = "text-white"
#    hover = "hover:bg-neurokube-800"
#    border = "border-white"

# Section visibility toggles
[params.sections]
  testimonials = false
  clientLogos = false
  faq = true

# FAQ shortcode default style (see layouts/shortcodes/faq.html /
# layouts/partials/faq.html). Instanciable par page (règle 12) : fonctionne
# par palette nommée pour l'accent, les markers, le menu de catégories et le
# bouton, même convention que [params.callout]/[params.cardsSection]/
# [params.feature] (règle 5) - le nom de la palette se passe via le
# paramètre "palette" du shortcode (ou faq.palette dans le front matter du
# layout expertise), défaut "default". Une instance peut toujours surcharger
# ponctuellement une classe précise (accentColor, markerColor, menuTextColor,
# menuActiveTextColor, buttonColor, background) par-dessus la palette
# choisie, pour un cas exceptionnel.
#
# "background" est volontairement IDENTIQUE sur les 3 palettes (blanc /
# neurokube foncé), même raisonnement que [params.callout] : la FAQ est une
# section de contenu neutre, seule sa couleur d'accent (icônes, markers,
# menu, bouton) doit changer d'une palette à l'autre, pas le fond de la
# section.
[params.faq]
  [params.faq.default]
    # Arrow in the menu + expand/collapse icons
    accent = "text-neurokube-600 dark:text-neurokube-600"
    # Bullet / number markers used inside the answers' lists
    marker = "marker:text-neurokube-600 dark:marker:text-neurokube-600"
    # Category nav text, inactive state
    menuText = "text-neurokube-600 dark:text-neurokube-600"
    # Category nav text, active state
    menuActiveText = "text-gray-900 dark:text-white"
    # Optional bottom button (see [params.faq.button] below), off by default per instance
    buttonColor = "bg-neurokube-600 text-white hover:bg-neurokube-700"
    # Full-width section background - white by default, a page can pass its
    # own "background" parameter to replace it (e.g. a light gray section).
    background = "bg-white dark:bg-neurokube-900"

  [params.faq.kube]
    accent = "text-kube-600 dark:text-kube-600"
    marker = "marker:text-kube-600 dark:marker:text-kube-600"
    menuText = "text-kube-600 dark:text-kube-600"
    menuActiveText = "text-gray-900 dark:text-white"
    buttonColor = "bg-kube-600 text-white hover:bg-kube-700"
    background = "bg-white dark:bg-neurokube-900"

  [params.faq.hr]
    accent = "text-hr-600 dark:text-hr-600"
    marker = "marker:text-hr-600 dark:marker:text-hr-600"
    menuText = "text-hr-600 dark:text-hr-600"
    menuActiveText = "text-gray-900 dark:text-white"
    buttonColor = "bg-hr-600 text-white hover:bg-hr-700"
    background = "bg-white dark:bg-neurokube-900"

  # Default label/link for the faq shortcode's optional bottom button
  # (shown only on instances calling faq with showButton="true").
  # Override the label under [languages.xx.params.faq.button].
  [params.faq.button]
    label = "Want to know more?"
    link = "/contact"

# Callout shortcode default style (see layouts/shortcodes/sokube-callout.html
# / layouts/partials/callout-block.html). Instanciable par page (règle 12) :
# fonctionne par palette nommée pour la description et les boutons, même
# convention que [params.cards]/[params.feature] (règle 5) - le nom de la
# palette se passe via le paramètre "palette" du shortcode (ou
# callout.palette dans le front matter du layout expertise), défaut
# "default". Une instance peut toujours surcharger ponctuellement une classe
# précise (background, descriptionColor, primaryButtonColor,
# secondaryButtonColor) par-dessus la palette choisie, pour un cas
# exceptionnel (voir le "full call" dans la doc du shortcode).
#
# "background" est volontairement IDENTIQUE sur les 3 palettes (gris neutre
# clair / neurokube foncé) : contrairement aux cards ou au hero fondu, où la
# couleur de fond EST l'identité de la palette, le callout est un bandeau
# secondaire discret - seule sa couleur d'accent (boutons, description) doit
# changer d'une palette à l'autre, pas le fond de la section.
[params.callout]
  [params.callout.default]
    background = "bg-gray-50 dark:bg-neurokube-800"
    description = "text-gray-600 dark:text-neurokube-200"
    descriptionLink = "text-neurokube-600 dark:text-neurokube-300"
    descriptionLinkHover = "hover:text-neurokube-700 dark:hover:text-neurokube-200"
    primaryButton = "bg-neurokube-600 text-white hover:bg-neurokube-700"
    secondaryButton = "bg-white dark:bg-neurokube-800 text-neurokube-600 dark:text-neurokube-100 hover:bg-neurokube-100 dark:hover:bg-neurokube-700 border-neurokube-600 dark:border-neurokube-400"

  [params.callout.kube]
    background = "bg-gray-50 dark:bg-neurokube-800"
    description = "text-gray-600 dark:text-kube-200"
    descriptionLink = "text-kube-600 dark:text-kube-300"
    descriptionLinkHover = "hover:text-kube-700 dark:hover:text-kube-200"
    primaryButton = "bg-kube-600 text-white hover:bg-kube-700"
    secondaryButton = "bg-white dark:bg-neurokube-800 text-kube-600 dark:text-kube-100 hover:bg-kube-100 dark:hover:bg-kube-800 border-kube-600 dark:border-kube-400"

  [params.callout.hr]
    background = "bg-gray-50 dark:bg-neurokube-800"
    description = "text-gray-600 dark:text-hr-200"
    descriptionLink = "text-hr-600 dark:text-hr-300"
    descriptionLinkHover = "hover:text-hr-700 dark:hover:text-hr-200"
    primaryButton = "bg-hr-600 text-white hover:bg-hr-700"
    secondaryButton = "bg-white dark:bg-neurokube-800 text-hr-600 dark:text-hr-100 hover:bg-hr-100 dark:hover:bg-hr-800 border-hr-600 dark:border-hr-400"

# Highlight-section shortcode default style (see layouts/shortcodes/sokube-highlight-section.html).
# One style for the whole site, same convention as [params.faq.default] above.
# A page can still override any of these via shortcode parameters for an
# exceptional case - background already is, on the "about" page.
[params.highlightSection]
  [params.highlightSection.style]
    # Section background (gradient)
    background = "bg-gradient-to-b from-blue-50 via-blue-50 to-white dark:from-neurokube-900 dark:via-neurokube-900 dark:to-neurokube-900"
    # Subtitle, right under the title
    subtitle = "text-gray-600 dark:text-neurokube-200"
    # Card background (the white/dark box holding card_title + .Inner)
    cardBackground = "bg-white dark:bg-neurokube-800"
    # Card border - only shown in dark mode (light mode uses a shadow instead, see the shortcode's template)
    cardBorder = "dark:border-neurokube-700"
    # Card body text (.Inner)
    cardText = "text-gray-600 dark:text-neurokube-200"

# Brand-heading style (see layouts/partials/brand-heading.html, used by both
# layouts/shortcodes/sokube-brand-heading.html and layouts/partials/
# trainings-extra-sections.html). One style for the whole site - every
# current call uses the default, but each can still override baseColor/
# accentColor on its own instance if needed.
[params.brandHeading]
  [params.brandHeading.style]
    # Plain (non-highlighted) part of the heading
    baseColor = "text-gray-900 dark:text-white"
    # *word*-wrapped part of the heading
    accentColor = "text-kube-600 dark:text-kube-600"

# Cards-section shortcode default style (see layouts/shortcodes/sokube-cards-section.html).
[params.cardsSection]
  # Style fixe (règle 5, second cas) : l'eyebrow ne varie jamais d'une page à
  # l'autre, quelle que soit la palette choisie ci-dessous.
  [params.cardsSection.style]
    eyebrow = "text-kube-600 dark:text-kube-600"

  # Instanciable par page (règle 12) : fonctionne par palette nommée pour la
  # description et le fond, même convention que [params.featuresSection] -
  # le nom de la palette se passe via le paramètre "palette" du shortcode,
  # défaut "default". Une instance peut toujours surcharger ponctuellement
  # "descriptionColor"/"background" par-dessus la palette choisie.
  [params.cardsSection.default]
    description = "text-gray-600 dark:text-neurokube-200"
    # Transparent by default (matches the previous, unconfigurable behavior) - a page
    # can override this per instance, e.g. background="bg-gray-50 dark:bg-neurokube-800".
    background = "bg-transparent dark:bg-transparent"

  [params.cardsSection.kube]
    description = "text-gray-600 dark:text-kube-200"
    background = "bg-transparent dark:bg-transparent"

  [params.cardsSection.hr]
    description = "text-gray-600 dark:text-hr-200"
    background = "bg-transparent dark:bg-transparent"

# Features-section shortcode default style (see layouts/shortcodes/sokube-features-section.html).
[params.featuresSection]
  # Instanciable par page (règle 12) : fonctionne par palette nommée pour la
  # description, même convention que [params.callout] (règle 5) - le nom de
  # la palette se passe via le paramètre "palette" du shortcode, défaut
  # "default". Une instance peut toujours surcharger ponctuellement
  # "descriptionColor"/"background" par-dessus la palette choisie.
  #
  # "background" est volontairement IDENTIQUE sur les 3 palettes (même
  # raisonnement que [params.callout]) : cette section n'est qu'un en-tête
  # de texte au-dessus d'une série de sokube-feature, pas une identité
  # visuelle en soi - seule la couleur de la description doit changer d'une
  # palette à l'autre.
  [params.featuresSection.default]
    description = "text-gray-600 dark:text-neurokube-200"
    background = "bg-gradient-to-b from-gray-50 to-white dark:from-neurokube-900 dark:to-neurokube-900"

  [params.featuresSection.kube]
    description = "text-gray-600 dark:text-kube-200"
    background = "bg-gradient-to-b from-gray-50 to-white dark:from-neurokube-900 dark:to-neurokube-900"

  [params.featuresSection.hr]
    description = "text-gray-600 dark:text-hr-200"
    background = "bg-gradient-to-b from-gray-50 to-white dark:from-neurokube-900 dark:to-neurokube-900"

# Cta-image shortcode default style (see layouts/shortcodes/sokube-cta-image.html).
[params.ctaImage]
  [params.ctaImage.style]
    buttonBackground = "bg-kube-600 dark:bg-kube-600"
    buttonTextColor = "text-white dark:text-white"

# Client-logos shortcode default style (see layouts/shortcodes/sokube-client-logos.html).
# Toggle with [params.sections].clientLogos.
[params.clientLogos]
  [params.clientLogos.style]
    border = "border-gray-100 dark:border-neurokube-800"
    title = "dark:text-white"

# Stats-grid shortcode ([params.stats.<palette>], see layouts/shortcodes/
# sokube-stats-grid.html). Repeated-per-page component (several stat cards
# side by side) - works by named palettes, same convention as [params.cards]:
# the template only selects the requested palette and validates its
# existence (rule 8), it contains no color of its own.
[params.stats]
  grid_gap = "gap-8"

  [params.stats.default]
    background = "bg-white dark:bg-neurokube-800"
    border = "border-neurokube-200 dark:border-neurokube-700"
    value = "text-kube-600 dark:text-kube-300"
    label = "text-gray-700 dark:text-gray-300"

# Testimonials shortcode default style (see layouts/shortcodes/sokube-testimonials.html).
# Toggle with [params.sections].testimonials.
[params.testimonials]
  [params.testimonials.style]
    sectionBackground = "bg-gray-50 dark:!bg-neurokube-900"
    description = "text-gray-600 dark:text-neurokube-200"
    personTitle = "text-gray-600 dark:text-neurokube-200"
    quote = "text-gray-600 dark:text-neurokube-100"
    cardBackground = "bg-white dark:bg-neurokube-800"
    # Card border - only shown in dark mode (light mode uses a shadow instead)
    cardBorder = "dark:border-neurokube-700"

# Pricing Configuration
[params.pricing]
  currency = "CHF"

  [params.pricing.style]
    sectionBackground = "bg-white dark:bg-neurokube-900"
    card_background = "bg-neurokube-50 dark:bg-neurokube-800"
    card_border = "border-neurokube-300 dark:border-neurokube-700"
    featured_border = "border-neurokube-600 dark:border-neurokube-300"
    featured_shadow = "shadow-xl"
    icon_color = "text-neurokube-600 dark:text-neurokube-300"
    title_color = "text-gray-900 dark:text-white"
    description_color = "text-gray-500 dark:text-neurokube-200"
    price_color = "text-gray-900 dark:text-white"

# Cards Configuration
[params.cards]
  grid_gap = "gap-8"

  # Palette existante — inchangée, reste le comportement par défaut
  [params.cards.default]
    background = "bg-gradient-to-br from-neurokube-100 to-neurokube-50 dark:from-neurokube-900 dark:to-neurokube-800"
    border = "border-neurokube-300 dark:border-neurokube-400"
    hover_border = "hover:border-neurokube-600 dark:hover:border-neurokube-400"
    label = "text-neurokube-600 dark:text-neurokube-300"
    title = "text-neurokube-900 dark:text-white"
    text = "text-gray-700 dark:text-gray-300"
    marker = "marker:text-neurokube-600 dark:marker:text-neurokube-300"
    # Eyebrow de la section (layouts/_default/expertise.html) - propre à la
    # palette de la section de cards, distinct de [params.cardsSection.<nom>]
    # (celui-là ne couvre que la description/le fond de sokube-cards-section,
    # un composant différent - son eyebrow reste fixe dans
    # [params.cardsSection.style], seul l'eyebrow des cards ci-dessous suit
    # leur propre palette).
    eyebrow = "text-neurokube-600 dark:text-neurokube-300"

  # Nouvelle palette KUBE (ex: cartes "PROBLEME" de la page About)
  [params.cards.kube]
    background = "bg-gradient-to-br from-kube-100 to-kube-50 dark:from-kube-900 dark:to-kube-800"
    border = "border-kube-300 dark:border-kube-400"
    hover_border = "hover:border-kube-600 dark:hover:border-kube-400"
    label = "text-kube-600 dark:text-kube-300"
    title = "text-kube-900 dark:text-white"
    text = "text-gray-700 dark:text-gray-300"
    marker = "marker:text-kube-600 dark:marker:text-kube-300"
    eyebrow = "text-kube-600 dark:text-kube-300"

  # Nouvelle palette HR (réutilisable ailleurs si besoin)
  [params.cards.hr]
    background = "bg-gradient-to-br from-hr-100 to-hr-50 dark:from-hr-900 dark:to-hr-800"
    border = "border-hr-300 dark:border-hr-400"
    hover_border = "hover:border-hr-600 dark:hover:border-hr-400"
    label = "text-hr-600 dark:text-hr-300"
    title = "text-hr-900 dark:text-white"
    text = "text-gray-700 dark:text-gray-300"
    marker = "marker:text-hr-600 dark:marker:text-hr-300"
    eyebrow = "text-hr-600 dark:text-hr-300"

# Card-image Configuration (sokube-card-image shortcode) : une image + un
# titre en surimpression (dégradé sombre en bas, pour la lisibilité).
[params.cardImage]
  # Style fixe (règle 5, second cas) : le dégradé de lisibilité et la couleur
  # du titre ne varient jamais d'une page à l'autre - identité visuelle
  # unique, quelle que soit l'image utilisée.
  [params.cardImage.style]
    title = "text-white"
    # Couleur de départ du dégradé (bas de la card, opaque) qui s'estompe
    # vers transparent en remontant - garantit la lisibilité du titre quelle
    # que soit l'image. Valeur CSS libre (rgba, hex...), pas une classe
    # Tailwind : construite en CSS inline (voir layouts/shortcodes/
    # sokube-card-image.html), donc aucune entrée de safelist nécessaire dans
    # tailwind.config.js, même si elle change.
    overlayColor = "rgba(0, 0, 0, 0.65)"
    # Intensité par défaut (%) de l'overlay coloré des palettes ci-dessous -
    # une instance de sokube-card-image peut la surcharger ponctuellement via
    # son paramètre "overlayOpacity".
    overlayOpacity = 50

  # Palette nommée (règle 15) pour l'overlay coloré de la card - contrairement
  # au dégradé ci-dessus, cette couleur peut raisonnablement varier d'une
  # page/instance à l'autre (ex. une couleur par secteur d'activité), d'où la
  # palette plutôt qu'un style fixe. Chaque palette ne référence qu'une
  # variable CSS (colorVar, assets/css/custom.css), même convention que
  # [params.heroFondu] : l'opacité (variable, réglée par overlayOpacity) est
  # appliquée en CSS inline sur le calque entier, jamais dans la couleur
  # elle-même - donc aucune entrée de safelist nécessaire dans
  # tailwind.config.js, quelle que soit la valeur choisie.
  [params.cardImage.default]
    colorVar = "--color-neurokube-900"

  [params.cardImage.kube]
    colorVar = "--color-kube-900"

  [params.cardImage.hr]
    colorVar = "--color-hr-900"

# Partners page (see layouts/shortcodes/sokube-partner-category.html and
# sokube-partner.html). One page, several category sections, each with a mix
# of "featured" cards and simple logos - see the /partners/ content page.
[params.partners]
  # Structural style shared by every sokube-partner-category section
  # (règle 5) : same title/description/border colors regardless of category.
  [params.partners.style]
    title = "text-neurokube-900 dark:text-white"
    description = "text-gray-600 dark:text-neurokube-200"
    border = "border-gray-200 dark:border-neurokube-700"
    label = "text-gray-500 dark:text-neurokube-300"

  # sokube-partners-filter pills - contrairement à [params.blog.categoryFilter]
  # / [params.trainings.categoryFilter] (fixes, site-wide), ce filtre est
  # instanciable par page (règle 12) : fonctionne par palette nommée, même
  # convention que [params.cards] (règle 5) - le nom de la palette se passe
  # via le paramètre "palette" du shortcode, défaut "default".
  [params.partners.categoryFilter]
    [params.partners.categoryFilter.default]
      border = "border-neurokube-900 dark:border-neurokube-100"

      [params.partners.categoryFilter.default.selected]
        background = "bg-neurokube-900 dark:bg-neurokube-100"
        text = "text-white dark:text-neurokube-900"
        hover_background = "hover:bg-neurokube-800 dark:hover:bg-neurokube-200"
        hover_text = "hover:text-white dark:hover:text-neurokube-900"

      [params.partners.categoryFilter.default.unselected]
        background = "bg-transparent dark:bg-transparent"
        text = "text-neurokube-900 dark:text-neurokube-100"
        hover_background = "hover:bg-neurokube-100 dark:hover:bg-neurokube-800"
        hover_text = "hover:text-neurokube-900 dark:hover:text-white"

    [params.partners.categoryFilter.kube]
      border = "border-kube-900 dark:border-kube-100"

      [params.partners.categoryFilter.kube.selected]
        background = "bg-kube-900 dark:bg-kube-100"
        text = "text-white dark:text-kube-900"
        hover_background = "hover:bg-kube-800 dark:hover:bg-kube-200"
        hover_text = "hover:text-white dark:hover:text-kube-900"

      [params.partners.categoryFilter.kube.unselected]
        background = "bg-transparent dark:bg-transparent"
        text = "text-kube-900 dark:text-kube-100"
        hover_background = "hover:bg-kube-100 dark:hover:bg-kube-800"
        hover_text = "hover:text-kube-900 dark:hover:text-white"

    [params.partners.categoryFilter.hr]
      border = "border-hr-900 dark:border-hr-100"

      [params.partners.categoryFilter.hr.selected]
        background = "bg-hr-900 dark:bg-hr-100"
        text = "text-white dark:text-hr-900"
        hover_background = "hover:bg-hr-800 dark:hover:bg-hr-200"
        hover_text = "hover:text-white dark:hover:text-hr-900"

      [params.partners.categoryFilter.hr.unselected]
        background = "bg-transparent dark:bg-transparent"
        text = "text-hr-900 dark:text-hr-100"
        hover_background = "hover:bg-hr-100 dark:hover:bg-hr-800"
        hover_text = "hover:text-hr-900 dark:hover:text-white"

  # sokube-partner "featured" card palettes - repeated several times per
  # category, same convention as [params.cards] above (including
  # validation, règle 8).
  [params.partners.featured.default]
    background = "bg-gradient-to-br from-neurokube-100 to-neurokube-50 dark:from-neurokube-900 dark:to-neurokube-800"
    border = "border-neurokube-300 dark:border-neurokube-400"
    hover_border = "hover:border-neurokube-600 dark:hover:border-neurokube-400"
    title = "text-neurokube-900 dark:text-white"
    text = "text-gray-700 dark:text-gray-300"

  [params.partners.featured.kube]
    background = "bg-gradient-to-br from-kube-100 to-kube-50 dark:from-kube-900 dark:to-kube-800"
    border = "border-kube-300 dark:border-kube-400"
    hover_border = "hover:border-kube-600 dark:hover:border-kube-400"
    title = "text-kube-900 dark:text-white"
    text = "text-gray-700 dark:text-gray-300"

  [params.partners.featured.hr]
    background = "bg-gradient-to-br from-hr-100 to-hr-50 dark:from-hr-900 dark:to-hr-800"
    border = "border-hr-300 dark:border-hr-400"
    hover_border = "hover:border-hr-600 dark:hover:border-hr-400"
    title = "text-hr-900 dark:text-white"
    text = "text-gray-700 dark:text-gray-300"

# Feature shortcode (see layouts/shortcodes/sokube-feature.html). Repeated
# several times per page - works by named palette for the badge and the
# button, same convention as [params.cards] above (including validation,
# rule 8). Title and description colors are NOT part of the palette: they
# stay the same regardless of which palette is used (matches the current
# site design, where only the badge/button accent changes between features).
[params.feature]
  [params.feature.style]
    title = "text-neurokube-900 dark:text-white"
    description = "text-gray-600 dark:text-neurokube-200"
    descriptionLink = "text-neurokube-600 dark:text-neurokube-300"
    descriptionLinkHover = "hover:text-neurokube-700 dark:hover:text-neurokube-200"

  # "colorVar" references a CSS custom property defined in assets/css/custom.css
  # (itself read from tailwind.config.js via theme(), single source of truth)
  # - used by layouts/_default/feature.html for a CSS color-mix() gradient,
  # where a Tailwind class can't be used directly (règle 14). Never put a raw
  # hex value here: add a new --color-<palette>-<shade> variable in
  # custom.css instead, and reference it here.
  # "button" combines background + text + hover for the optional CTA button
  # (showButton="true" on sokube-feature, or button_text/button_link on a
  # layout expertise features[] block) - applied on top of the generic ".btn"
  # structural class rather than the fixed ".btn-neurokube" class, so its
  # color follows the palette instead of always being neurokube blue.
  [params.feature.default]
    badgeBackground = "bg-neurokube-100 dark:bg-neurokube-800"
    badgeText = "text-neurokube-600 dark:text-neurokube-100"
    colorVar = "--color-neurokube-600"
    button = "bg-neurokube-600 text-white hover:bg-neurokube-700"

  [params.feature.kube]
    badgeBackground = "bg-kube-100 dark:bg-kube-800"
    badgeText = "text-kube-600 dark:text-kube-100"
    colorVar = "--color-kube-600"
    button = "bg-kube-600 text-white hover:bg-kube-700"

  [params.feature.hr]
    badgeBackground = "bg-hr-100 dark:bg-hr-800"
    badgeText = "text-hr-600 dark:text-hr-100"
    colorVar = "--color-hr-600"
    button = "bg-hr-600 text-white hover:bg-hr-700"

# Two-columns shortcode default style (see layouts/shortcodes/sokube-two-columns.html).
# Instanciable par page (règle 12) : fonctionne par palette nommée pour le
# bouton, même convention que [params.feature]/[params.callout] (règle 5) -
# le nom de la palette se passe via le paramètre "palette" du shortcode,
# défaut "default".
[params.twoColumns]
  [params.twoColumns.default]
    button = "bg-neurokube-600 text-white hover:bg-neurokube-700"

  [params.twoColumns.kube]
    button = "bg-kube-600 text-white hover:bg-kube-700"

  [params.twoColumns.hr]
    button = "bg-hr-600 text-white hover:bg-hr-700"

# Contract types ("cdi"/"cdd"/"stage") - code interne langue-indépendant,
# unique source de vérité pour deux choses distinctes : la palette à utiliser
# (champ "palette", ci-dessous - jamais surchargé par langue) et le texte
# affiché (champ "label", surchargé par langue sous
# [languages.xx.params.contractTypes.<code>] plus bas dans ce fichier).
# Utilisé à la fois par layouts/_default/job-listing.html (résolution directe
# depuis le champ contractType du front matter) et par
# layouts/shortcodes/sokube-card.html (résolution automatique de la palette
# depuis le label affiché sur la card, voir
# layouts/partials/resolve-contract-palette.html) - une seule fois configuré
# ici, robuste au changement de langue des deux côtés.
[params.contractTypes]
  [params.contractTypes.cdi]
    palette = "kube"

  [params.contractTypes.cdd]
    palette = "default"

  [params.contractTypes.stage]
    palette = "hr"

# Job Listing (layouts/_default/job-listing.html) - page individuelle
# d'une offre d'emploi. Le badge "type de contrat" est coloré par palette
# nommée ("default"/"kube"/"hr", même convention que [params.feature],
# règle 14) - le contractType du front matter (cdi/cdd/stage) est résolu en
# palette via [params.contractTypes] ci-dessus, jamais directement ici.
# colorVar référence une variable CSS définie dans assets/css/custom.css,
# jamais une valeur hex en dur.
[params.jobListing]
  [params.jobListing.style]
    heroBackground = "bg-gray-50 dark:bg-neurokube-900"
    title = "text-neurokube-900 dark:text-white"
    intro = "text-gray-600 dark:text-neurokube-200"
    sectionBackgroundA = "bg-white dark:bg-neurokube-900"
    sectionBackgroundB = "bg-gray-50 dark:bg-neurokube-800"
    sectionTitle = "text-neurokube-900 dark:text-white"
    sectionText = "text-gray-600 dark:text-neurokube-200"
  [params.jobListing.default]
    badgeBackground = "bg-neurokube-100 dark:bg-neurokube-800"
    badgeText = "text-neurokube-600 dark:text-neurokube-100"
    colorVar = "--color-neurokube-600"
    button = "bg-neurokube-600 text-white hover:bg-neurokube-700 dark:hover:bg-neurokube-500"
    pillBackground = "bg-neurokube-100 dark:bg-neurokube-800"
    pillText = "text-neurokube-700 dark:text-neurokube-100"

  [params.jobListing.kube]
    badgeBackground = "bg-kube-100 dark:bg-kube-800"
    badgeText = "text-kube-600 dark:text-kube-100"
    colorVar = "--color-kube-600"
    button = "bg-kube-600 text-white hover:bg-kube-700 dark:hover:bg-kube-500"
    pillBackground = "bg-kube-100 dark:bg-kube-800"
    pillText = "text-kube-700 dark:text-kube-100"

  [params.jobListing.hr]
    badgeBackground = "bg-hr-100 dark:bg-hr-800"
    badgeText = "text-hr-600 dark:text-hr-100"
    colorVar = "--color-hr-600"
    button = "bg-hr-600 text-white hover:bg-hr-700 dark:hover:bg-hr-500"
    pillBackground = "bg-hr-100 dark:bg-hr-800"
    pillText = "text-hr-700 dark:text-hr-100"

# Décoration "losanges de marque" (voir layouts/partials/brand-diamonds.html,
# règle 13 : partial partagée réutilisable par sokube-two-columns,
# sokube-callout et sokube-features-section). Règle 15 : couleur liée à la
# palette du composant appelant, priorité au shortcode/layout. Le petit
# losange utilise TOUJOURS [params.diamonds.default].small (peu importe la
# palette de l'appelant) ; le grand losange utilise [params.diamonds.<palette
# de l'appelant>].large.
[params.diamonds]
  [params.diamonds.default]
    small = "bg-neurokube-900 dark:bg-neurokube-100"
    large = "bg-neurokube-600 dark:bg-neurokube-800"

  [params.diamonds.kube]
    large = "bg-kube-600 dark:bg-kube-800"

  [params.diamonds.hr]
    large = "bg-hr-600 dark:bg-hr-800"

# Top-tips shortcode (see layouts/shortcodes/sokube-top-tips.html), used on
# expertise pages. Site-wide : une seule identité visuelle pour tout le site
# (bandeau, préfixe, couleurs) - rien de tout ça ne se passe en paramètre du
# shortcode, seul le contenu (titre, description, tips) change d'une page à
# l'autre. Override possible par langue sous [languages.xx.params.topTips].
[params.topTips]
  # Bandeau fixe, partagé par toutes les instances (image statique, ne varie
  # pas selon le mode clair/sombre).
  bannerImage = "/images/expertises/tips-by-sokube.png"
  # Préfixe affiché avant le titre (ex: "Tips by SoKube : <titre>")
  prefix = "Tips by SoKube :"

  [params.topTips.style]
    prefixColor = "text-kube-600 dark:text-kube-600"
    titleColor = "text-neurokube-900 dark:text-white"
    descriptionColor = "text-gray-600 dark:text-neurokube-200"
    iconColor = "text-kube-600 dark:text-kube-600"
    tipTitleColor = "text-neurokube-900 dark:text-white"
    tipTextColor = "text-gray-600 dark:text-neurokube-200"

# Forms Configuration
[params.forms]

  [params.forms.style]
    container = "max-w-3xl mx-auto"
    input = "w-full rounded-xl border border-gray-300 dark:border-neurokube-700 dark:bg-neurokube-900 dark:text-white px-4 py-3"
    label = "block text-sm font-medium mb-2 text-gray-700 dark:text-neurokube-100"
    button = "btn btn-primary w-full"
    # Label of a sokube-form-checkbox field
    checkboxLabel = "text-sm text-gray-600 dark:text-neurokube-200"
    # The "*" marker next to a required field's label (sokube-form-field, sokube-form-textarea)
    requiredColor = "text-kube-600 dark:text-kube-600"

[module]
  [module.hugoVersion]
    extended = true
    min = "0.80.0"

[build]
  writeStats = true

[build.buildStats]
  enable = true

[security.funcs]
  getenv = ['^HUGO_', '^CI$']

[security.node.permissions]
  disable = true

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = true
    codeFences = true
    guessSyntax = true
    lineNumbersInTable = true
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2

